<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRBL · диагностика Web Serial</title>
<style>
  :root{--bg:#12141a;--card:#1c1f27;--fg:#e6e8ee;--muted:#9aa3b2;--accent:#4da3ff;--ok:#3ecf7a;--err:#ff6b6b;--tx:#4da3ff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Roboto,Segoe UI,sans-serif;padding:12px;}
  h1{font-size:1.15rem;margin:.2rem 0 1rem}
  h2{font-size:1rem;margin:0 0 .6rem;color:var(--accent)}
  .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;}
  button{background:#2a2f3a;color:var(--fg);border:1px solid #3a4150;border-radius:10px;padding:12px 16px;font-size:15px;min-height:46px;}
  button:active{background:#39414f}
  button:disabled{opacity:.4}
  #btnConnect{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
  select,input{background:#0f1218;color:var(--fg);border:1px solid #3a4150;border-radius:8px;padding:10px;font-size:15px;min-height:46px}
  input#manual{flex:1;min-width:200px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:4px 6px;border-bottom:1px solid #2a2f3a;vertical-align:top;word-break:break-all}
  td.k{color:var(--muted);white-space:nowrap;width:40%}
  .warn{background:#3a2a12;color:#ffcf8a;border-radius:8px;padding:10px;margin:.6rem 0 0;font-size:14px}
  .hint{color:var(--muted);font-size:13px;margin:.4rem 0 0}
  .log{background:#0b0d12;border-radius:10px;padding:10px;height:46vh;min-height:220px;overflow:auto;margin:0;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .line.rx{color:var(--ok)}
  .line.tx{color:var(--tx)}
  .line.err{color:var(--err)}
  .line.info{color:var(--muted)}
  .chk{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<h1>GRBL · диагностика Web Serial на планшете</h1>

<section class="card">
  <h2>1. Окружение</h2>
  <table id="envTable"></table>
  <p id="envWarning" class="warn" hidden></p>
</section>

<section class="card">
  <h2>2. Подключение к станку (USB‑OTG)</h2>
  <div class="row">
    <label>Скорость:
      <select id="baud">
        <option>115200</option>
        <option>250000</option>
        <option>57600</option>
        <option>38400</option>
        <option>19200</option>
        <option>9600</option>
      </select>
    </label>
  </div>
  <div class="row">
    <button id="btnConnect">Выбрать порт и открыть</button>
    <button id="btnDisconnect" disabled>Закрыть</button>
    <button id="btnDtr" disabled>Сброс (пульс DTR)</button>
  </div>
  <p class="hint">При первом подключении Chrome спросит разрешение на USB‑устройство — разрешите.</p>
</section>

<section class="card">
  <h2>3. Команды GRBL</h2>
  <div class="row">
    <button id="btnStatus" disabled>Статус «?»</button>
    <button id="btnInfo" disabled>Версия «$I»</button>
    <button id="btnSettings" disabled>Настройки «$$»</button>
    <button id="btnUnlock" disabled>«$X»</button>
    <button id="btnHome" disabled>«$H»</button>
    <button id="btnReset" disabled>Soft reset (Ctrl‑X)</button>
  </div>
  <div class="row">
    <input id="manual" placeholder="Своя команда, напр. $J=G91 X10 F600" disabled>
    <button id="btnSend" disabled>Отправить</button>
  </div>
</section>

<section class="card">
  <h2>4. Лог</h2>
  <div class="row">
    <button id="btnClearLog">Очистить</button>
    <label class="chk"><input type="checkbox" id="autoScroll" checked> авто‑прокрутка</label>
  </div>
  <pre id="log" class="log"></pre>
</section>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const logEl = $('log');

  let port = null;
  let reader = null;
  let writer = null;
  let readLoopRunning = false;
  let lineBuf = '';
  const decoder = new TextDecoder();
  const encoder = new TextEncoder();

  /* ---------- логирование ---------- */
  function ts() {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' +
           String(d.getMilliseconds()).padStart(3, '0');
  }
  function log(msg, cls) {
    const el = document.createElement('div');
    el.className = 'line' + (cls ? ' ' + cls : '');
    el.textContent = '[' + ts() + '] ' + msg;
    logEl.appendChild(el);
    if ($('autoScroll').checked) logEl.scrollTop = logEl.scrollHeight;
  }

  /* ---------- окружение ---------- */
  function detectEnv() {
    const hasSerial = 'serial' in navigator;
    const rows = [
      ['location.protocol', location.protocol],
      ['isSecureContext', String(window.isSecureContext)],
      ["'serial' in navigator", String(hasSerial)],
      ["'usb' in navigator", String('usb' in navigator)]
    ];
    const t = $('envTable');
    t.innerHTML = '';
    for (const [k, v] of rows) {
      const tr = t.insertRow();
      tr.insertCell().outerHTML = '<td class="k">' + k + '</td>';
      tr.insertCell().textContent = v;
    }
    const w = $('envWarning');
    if (!window.isSecureContext) {
      w.hidden = false;
      w.textContent = '⚠ Не защищённый контекст. Web Serial требует HTTPS, localhost или file://. Откройте страницу иначе.';
    } else if (!hasSerial) {
      w.hidden = false;
      w.textContent = '⚠ navigator.serial отсутствует. Нужен Chrome for Android 154+ (или десктопный Chrome/Edge 89+).';
    }
    log('Окружение: secure=' + window.isSecureContext + ', serial=' + hasSerial, 'info');
  }

  /* ---------- кнопки вкл/выкл ---------- */
  const cmdButtons = ['btnStatus','btnInfo','btnSettings','btnUnlock','btnHome','btnReset','btnDtr'];
  function setConnected(on) {
    $('btnConnect').disabled = on;
    $('btnDisconnect').disabled = !on;
    cmdButtons.forEach((id) => { $(id).disabled = !on; });
    $('manual').disabled = !on;
    $('btnSend').disabled = !on;
  }

  /* ---------- открытие порта ---------- */
  async function connect() {
    if (!('serial' in navigator)) { log('Web Serial недоступен на этом устройстве', 'err'); return; }
    try {
      port = await navigator.serial.requestPort();        // внутри клика — требование transient activation
      const info = port.getInfo();
      log('Порт выбран: VID=' + hex(info.usbVendorId) + ' PID=' + hex(info.usbProductId), 'info');
      const baud = parseInt($('baud').value, 10);
      await port.open({ baudRate: baud, dataBits: 8, stopBits: 1, parity: 'none', flowControl: 'none' });
      log('Порт открыт на ' + baud + ' бод. Ждём приветствие GRBL…', 'info');
      setConnected(true);
      startReadLoop();
    } catch (e) {
      log('Ошибка открытия: ' + e.name + ' — ' + e.message, 'err');
      if (e.name === 'NotFoundError') log('Порт не выбран пользователем.', 'err');
      if (e.name === 'SecurityError') log('Отказано в доступе (нужен secure context / разрешение).', 'err');
    }
  }
  function hex(v) { return (v == null) ? '—' : '0x' + v.toString(16).toUpperCase(); }

  async function disconnect() {
    readLoopRunning = false;
    try { if (reader) await reader.cancel(); } catch (_) {}
    try { if (writer) writer.releaseLock(); } catch (_) {}
    try { if (port) await port.close(); } catch (e) { log('close: ' + e.message, 'err'); }
    port = null; reader = null; writer = null;
    setConnected(false);
    log('Порт закрыт', 'info');
  }

  /* ---------- цикл чтения ---------- */
  async function startReadLoop() {
    readLoopRunning = true;
    while (port && port.readable && readLoopRunning) {
      reader = port.readable.getReader();
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          onData(decoder.decode(value, { stream: true }));
        }
      } catch (e) {
        log('Read: ' + e.name + ' — ' + e.message, 'err');
      } finally {
        try { reader.releaseLock(); } catch (_) {}
        reader = null;
      }
    }
  }

  function onData(text) {
    lineBuf += text;
    let idx;
    while ((idx = lineBuf.indexOf('\n')) >= 0) {
      const line = lineBuf.slice(0, idx).replace(/\r$/, '');
      lineBuf = lineBuf.slice(idx + 1);
      if (line.length) log(line, 'rx');
    }
    // неполный "хвост" без \n (редко) — покажем как есть, если он длинный
    if (lineBuf.length > 200) { log(lineBuf, 'rx'); lineBuf = ''; }
  }

  /* ---------- запись ---------- */
  async function writeBytes(bytes) {
    if (!port || !port.writable) { log('Порт не открыт', 'err'); return; }
    writer = port.writable.getWriter();
    try { await writer.write(new Uint8Array(bytes)); }
    catch (e) { log('Write: ' + e.message, 'err'); }
    finally { try { writer.releaseLock(); } catch (_) {} writer = null; }
  }
  async function sendLine(str) {
    await writeBytes(Array.from(encoder.encode(str)));
    log('→ ' + str.replace(/\r?\n$/, ''), 'tx');
  }

  async function pulseDtr() {
    if (!port) return;
    try {
      await port.setSignals({ dataTerminalReady: false });
      await new Promise((r) => setTimeout(r, 50));
      await port.setSignals({ dataTerminalReady: true });
      log('DTR‑пульс выполнен (сброс платы). Ждём приветствие…', 'info');
    } catch (e) { log('setSignals: ' + e.message, 'err'); }
  }

  /* ---------- события ---------- */
  $('btnConnect').addEventListener('click', connect);
  $('btnDisconnect').addEventListener('click', disconnect);
  $('btnDtr').addEventListener('click', pulseDtr);
  $('btnStatus').addEventListener('click', () => sendLine('?'));
  $('btnInfo').addEventListener('click', () => sendLine('$I\r\n'));
  $('btnSettings').addEventListener('click', () => sendLine('$$\r\n'));
  $('btnUnlock').addEventListener('click', () => sendLine('$X\r\n'));
  $('btnHome').addEventListener('click', () => sendLine('$H\r\n'));
  $('btnReset').addEventListener('click', () => { writeBytes([0x18]); log('→ soft reset (0x18)', 'tx'); });
  $('btnSend').addEventListener('click', () => {
    const v = $('manual').value.trim();
    if (v) sendLine(v + '\r\n');
    $('manual').value = '';
  });
  $('manual').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnSend').click(); });
  $('btnClearLog').addEventListener('click', () => { logEl.innerHTML = ''; });

  if ('serial' in navigator) {
    navigator.serial.addEventListener('connect', (e) => log('USB подключён: ' + JSON.stringify(e.target.getInfo ? e.target.getInfo() : {}), 'info'));
    navigator.serial.addEventListener('disconnect', () => { log('USB отключён', 'err'); disconnect(); });
    navigator.serial.getPorts().then((ports) => log('Ранее разрешённых портов: ' + ports.length, 'info'));
  }

  detectEnv();
})();
</script>
</body>
</html>
